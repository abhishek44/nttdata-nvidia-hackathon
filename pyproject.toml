[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recallzero"
version = "0.2.2"
description = "Evidence-grounded vehicle defect early-warning and historical recall backtesting"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "RecallZero Project" }]
keywords = ["automotive", "nhtsa", "defect-detection", "nvidia-nim", "nemo-agent-toolkit", "aiq"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<16",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
# `aiq` is the user-facing alias for current NeMo Agent Toolkit integration.
# `nat` is provided as an equivalent, explicit name.
aiq = [
  "nvidia-nat[langchain]>=1.5,<2",
]
nat = [
  "nvidia-nat[langchain]>=1.5,<2",
]
aiq-legacy = [
  "aiqtoolkit[langchain]>=1.1,<1.2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
recallzero = "recallzero.cli:app"
recallzero-aiq-patch = "recallzero.aiq.blueprint_patch:main"

[project.entry-points.'nat.plugins']
recallzero = "recallzero.aiq.register"

[project.entry-points.'aiq.components']
recallzero = "recallzero.aiq.legacy_register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recallzero = ["web/static/*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
