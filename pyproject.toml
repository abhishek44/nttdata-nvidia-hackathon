[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recallzero"
version = "0.1.0"
description = "NVIDIA-powered vehicle defect early-warning and recall backtesting MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "typer>=0.12",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recallzero = "recallzero.cli:app"

[tool.setuptools.packages.find]
include = ["recallzero*"]
