# Manifest consumed directly by `recallzero benchmark`.
# `expected_role` and target campaign metadata are evaluation-only; they must never
# be exposed to the detector before a snapshot is frozen.
candidates:
  - name: Mustang Mach-E high-voltage contactor recall
    make: FORD
    model: MUSTANG MACH-E
    model_years: [2021, 2022]
    campaign_number: 22V412000
    official_recall_date: 2022-06-10
    expected_role: positive
    benchmark_split: development
    defect_family: HIGH_VOLTAGE_POWER_DISTRIBUTION
    status: detector_v1_development_positive
    note: >-
      Known-answer development case used during architecture iteration. Detector Freeze v1
      reproduces a qualified 2022-05-26 alert in leakage-safe replay; do not treat this case
      as an untouched holdout. Add unrelated positive recalls and targetless negative controls
      before changing Detector v1.

