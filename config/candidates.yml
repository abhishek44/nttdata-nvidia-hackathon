# RecallZero Detector v1 benchmark registry.
#
# Scientific contract:
# - `expected_role`, campaign metadata, and adjudication boundaries are evaluation-only.
# - The detector never receives future target recall text before a snapshot is frozen.
# - `development` cases have already influenced architecture and cannot support a clean
#   generalization claim.
# - `validation` cases are preregistered here before Detector v1 scoring.
# - `holdout` is reserved for a future Detector v2 and requires explicit CLI confirmation.
# - Controls are targetless replay windows. An alert is not called a false positive merely
#   because no target campaign was specified; later recalls are exposed only during post-hoc
#   adjudication and unmatched alerts are reported as UNCONFIRMED_ALERT.
benchmark:
  id: detector-v1-validation-01
  detector_freeze: recallzero-detector-v1
  selection_policy: complaint_addressable_safety_recalls_v1
  preregistered: true
  acceptance_criteria:
    positive_sensitivity_min: 0.60
    median_qualified_lead_time_days_min: 1.0
    unconfirmed_alert_lineages_per_vehicle_replay_year_max: 1.0
    control_cases_with_unconfirmed_alerts_rate_max: 0.30
    anti_leakage_required: true
    minimum_nim_fraction: 1.0

candidates:
  # ---------------------------------------------------------------------------
  # DEVELOPMENT — already inspected while building Detector v1.
  # ---------------------------------------------------------------------------
  - name: Mustang Mach-E high-voltage contactor recall
    make: FORD
    model: MUSTANG MACH-E
    model_years: [2021, 2022]
    campaign_number: 22V412000
    official_recall_date: 2022-06-10
    expected_role: positive
    benchmark_split: development
    defect_family: HIGH_VOLTAGE_POWER_DISTRIBUTION
    selection_stratum: high_voltage_electrical
    status: detector_v1_development_positive
    note: >-
      Known-answer development case used during architecture iteration. It must not be
      included in Detector v1 validation sensitivity.

  # ---------------------------------------------------------------------------
